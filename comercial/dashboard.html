<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel comercial — Kogu Asistencias</title>
  <link rel="stylesheet" href="/styles/styles.css?v=1.3">
  <style>
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
    .kpi-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px}
    .kpi-box .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}
    .kpi-box .kpi-value{font-size:22px;font-weight:800;color:#0f172a;margin-top:4px}
    .pc-sectitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:800;margin:18px 0 8px}
    .pc-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:6px}
    .pc-actions a{border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;background:#fff;border:1px solid #dbe3e7;color:#334;text-decoration:none}
    .pc-actions a.primary{background:#0f172a;color:#fff;border-color:#0f172a}
    .pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
    @media(max-width:820px){.pc-grid{grid-template-columns:1fr}}
    .fbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
    .fbar .lab{width:130px;color:#475569}
    .fbar .track{flex:1;background:#eef2f6;border-radius:6px;height:16px;overflow:hidden}
    .fbar .fill{height:100%;background:linear-gradient(90deg,#0891b2,#22b8cf);border-radius:6px;min-width:2px}
    .fbar .n{width:24px;text-align:right;font-weight:800}
    .pc-table{width:100%;border-collapse:collapse;font-size:13px}
    .pc-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;padding:7px 6px;border-bottom:1px solid #f1f5f9}
    .pc-table td{padding:9px 6px;border-bottom:1px solid #f8fafc}
    .pc-lk{color:#0891b2;text-decoration:none;font-weight:700}
    .pc-sem{display:inline-block;width:9px;height:9px;border-radius:50%}
    .pc-empty{color:#94a3b8;font-size:13px;padding:14px 2px}
    .pc-subtitle{color:#64748b}
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar-placeholder"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Promotoría</div>
        <h1>Panel comercial</h1>
        <p class="pc-subtitle">Tu cartera y tu embudo de venta de un vistazo · <span id="pc-user">—</span></p>
      </div>
    </div>

    <div class="content">
      <div class="pc-actions">
        <a class="primary" href="/comercial/nueva-oportunidad.html">+ Nueva oportunidad</a>
        <a href="/comercial/pipeline.html">🗂️ Ver pipeline</a>
        <a href="/comercial/renovaciones.html">🔁 Renovaciones</a>
        <a href="/comercial/clientes.html">🧑‍💼 Clientes</a>
      </div>

      <div class="pc-sectitle">Mi cartera</div>
      <div class="kpi-row" id="cartera-row"></div>

      <div class="pc-sectitle">Mi embudo de venta</div>
      <div class="kpi-row" id="embudo-row"></div>

      <div class="pc-grid">
        <div class="card data-section">
          <div class="data-section__title">Embudo por etapa</div>
          <div id="funnel"></div>
        </div>
        <div>
          <div class="card data-section" style="margin-bottom:14px">
            <div class="data-section__title">🔁 Renovaciones próximas (≤ 45 días)</div>
            <div id="reno-list"></div>
          </div>
          <div class="card data-section">
            <div class="data-section__title">⏰ Por recontactar</div>
            <div id="recontacto-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/config.js?v=1.3"></script>
<script src="/js/services/api.js?v=1.3"></script>
<script src="/js/services/auth.service.js?v=1.3"></script>
<script src="/js/services/oportunidades.service.js?v=1.3"></script>
<script src="/js/services/polizas.service.js?v=1.3"></script>
<script src="/js/utils/format.js?v=1.3"></script>
<script src="/js/utils/toast.js?v=1.3"></script>
<script src="/js/utils/permisos.js?v=1.3"></script>
<script src="/js/components/sidebar.js?v=1.3"></script>
<script src="/js/utils/auth.guard.js?v=1.3"></script>
<script src="/js/pages/dashboard-comercial.js?v=1.3"></script>
</body>
</html>
