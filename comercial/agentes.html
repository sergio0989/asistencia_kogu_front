<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agentes — Kogu Asistencias</title>
  <link rel="stylesheet" href="/styles/styles.css?v=1.5">
  <style>
    .filters-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .filters-bar input,.filters-bar select{height:36px;padding:0 12px;border-radius:8px;border:1px solid #e2e8f0;font-size:13px;background:#fff}
    .filters-bar input{min-width:220px}
    .ag-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#ede9fe;color:#5b21b6;flex-shrink:0}
    .badge-info{background:#dbeafe;color:#1e40af}.badge-success{background:#dcfce7;color:#166534}
    .badge-secondary{background:#f1f5f9;color:#64748b}.badge-warning{background:#fef9c3;color:#92400e}.badge-danger{background:#fee2e2;color:#991b1b}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
    .dot-active{background:#16a34a}.dot-inactive{background:#94a3b8}
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar-placeholder"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Promotoría</div>
        <h1>Agentes</h1>
        <p>Agentes de la promotoría y sus documentos</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-primary" id="btn-nuevo-agente">➕ Nuevo agente</button>
      </div>
    </div>

    <div class="content">
      <div class="filters-bar">
        <input type="text" id="filtro-buscar" placeholder="🔍  Nombre, RFC o email…">
        <select id="filtro-activo"><option value="">Todos</option><option value="true">Activos</option><option value="false">Inactivos</option></select>
        <select id="filtro-jerarquia">
          <option value="">Todos (raíz y sub-agentes)</option>
          <option value="raiz">Solo agentes raíz</option>
        </select>
        <span class="picker-field">
          <input type="text" id="filtro-padre-label" class="form-control" readonly
                 placeholder="Sub-agentes de…" style="min-width:180px">
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-padre-btn" title="Elegir titular">🔍</button>
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-padre-clear" title="Quitar filtro">✕</button>
        </span>
        <input type="hidden" id="filtro-padre">
        <button class="btn btn-ghost btn-sm" id="btn-limpiar">Limpiar</button>
        <span id="contador-agentes" style="margin-left:auto;font-size:13px;color:#64748b"></span>
      </div>

      <div class="table-wrap">
        <table style="width:100%">
          <thead><tr>
            <th>Agente</th><th>Depende de</th><th>Contacto</th><th>Cédula</th><th>Vigencia cédula</th>
            <th style="text-align:center">Sub-agentes</th><th style="text-align:center">Clientes</th>
            <th>Estado</th><th style="text-align:center">Acciones</th>
          </tr></thead>
          <tbody id="tabla-agentes-body"></tbody>
        </table>
      </div>
      <div id="paginacion" style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:14px;font-size:13px"></div>
    </div>
  </main>
</div>

<!-- MODAL: Crear / Editar agente -->
<div class="modal-backdrop" id="modal-agente" style="display:none">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><h3 class="modal-title" id="modal-agente-titulo">Nuevo agente</h3>
      <button class="modal-close" onclick="modal.close('modal-agente')">&times;</button></div>
    <div class="modal-body"><form id="form-agente" autocomplete="off"><div class="form-grid">
      <div class="form-group form-group--full"><label>Nombre <span style="color:#dc2626">*</span></label><input type="text" id="a-nombre" class="form-control" maxlength="150"></div>
      <div class="form-group"><label>RFC</label><input type="text" id="a-rfc" class="form-control" maxlength="13"></div>
      <div class="form-group"><label>Teléfono</label><input type="text" id="a-telefono" class="form-control" maxlength="20"></div>
      <div class="form-group"><label>Email</label><input type="email" id="a-email" class="form-control" maxlength="150"></div>
      <div class="form-group" id="grupo-promotoria"><label>Promotoría</label><select id="a-promotoria" class="form-control"></select></div>
      <div class="form-group">
        <label>Depende de (agente)</label>
        <div class="picker-field">
          <input type="text" id="a-padre-label" class="form-control" readonly
                 placeholder="— Agente raíz (sin dependencia) —">
          <button type="button" class="btn btn-ghost btn-sm" id="a-padre-btn" title="Buscar agente">🔍</button>
          <button type="button" class="btn btn-ghost btn-sm" id="a-padre-clear" title="Quitar">✕</button>
        </div>
        <input type="hidden" id="a-agente-padre">
        <div style="font-size:11px;color:#94a3b8;margin-top:4px">
          Un solo nivel: el titular debe ser un agente raíz de la misma promotoría.
        </div>
      </div>
      <div class="form-group"><label>Cédula tipo</label><input type="text" id="a-cedula-tipo" class="form-control" maxlength="5" placeholder="A, B, C…"></div>
      <div class="form-group"><label>Cédula número</label><input type="text" id="a-cedula-numero" class="form-control" maxlength="30"></div>
      <div class="form-group"><label>Vigencia de cédula</label><input type="date" id="a-cedula-vigencia" class="form-control"></div>
      <div class="form-group form-group--full" id="grupo-activo" style="display:none">
        <label class="checkbox-item"><input type="checkbox" id="a-activo" checked> Agente activo</label></div>
    </div></form></div>
    <div class="modal-footer" style="display:flex;gap:8px;justify-content:flex-end;padding:16px 24px;border-top:1px solid #f1f5f9">
      <button class="btn btn-ghost" onclick="modal.close('modal-agente')">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-agente">Guardar</button></div>
  </div>
</div>

<!-- MODAL: Documentos del agente -->
<div class="modal-backdrop" id="modal-docs" style="display:none">
  <div class="modal-box" style="max-width:560px">
    <div class="modal-header"><h3 class="modal-title">Documentos · <span id="docs-agente-nombre"></span></h3>
      <button class="modal-close" onclick="modal.close('modal-docs')">&times;</button></div>
    <div class="modal-body">
      <div id="docs-list" style="margin-bottom:14px"></div>
      <div class="form-grid" style="border-top:1px solid #f1f5f9;padding-top:12px">
        <div class="form-group"><label>Tipo</label><input type="text" id="doc-tipo" class="form-control" maxlength="50" placeholder="cedula, contrato…"></div>
        <div class="form-group"><label>Vencimiento</label><input type="date" id="doc-vencimiento" class="form-control"></div>
        <div class="form-group form-group--full"><label>Archivo</label><input type="file" id="doc-archivo" class="form-control"></div>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;gap:8px;justify-content:flex-end;padding:16px 24px;border-top:1px solid #f1f5f9">
      <button class="btn btn-ghost" onclick="modal.close('modal-docs')">Cerrar</button>
      <button class="btn btn-primary" id="btn-subir-doc-agente">Subir documento</button></div>
  </div>
</div>

<script src="/js/config.js?v=1.5"></script>
<script src="/js/services/api.js?v=1.5"></script>
<script src="/js/services/auth.service.js?v=1.5"></script>
<script src="/js/services/catalogos.service.js?v=1.5"></script>
<script src="/js/services/agentes.service.js?v=1.5"></script>
<script src="/js/utils/format.js?v=1.5"></script>
<script src="/js/utils/toast.js?v=1.5"></script>
<script src="/js/utils/modal.js?v=1.5"></script>
<script src="/js/utils/picker.js?v=1.5"></script>
<script src="/js/utils/table.js?v=1.5"></script>
<script src="/js/utils/formErrors.js?v=1.5"></script>
<script src="/js/utils/permisos.js?v=1.5"></script>
<script src="/js/components/sidebar.js?v=1.5"></script>
<script src="/js/utils/auth.guard.js?v=1.5"></script>
<script src="/js/pages/agentes.js?v=1.5"></script>
</body>
</html>
