<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pipeline — Kogu Asistencias</title>
  <link rel="stylesheet" href="/styles/styles.css?v=1.6">
  <style>
    .badge-info{background:#dbeafe;color:#1e40af}
    .badge-primary{background:#e0e7ff;color:#3730a3}
    .badge-success{background:#dcfce7;color:#166534}
    .badge-secondary{background:#f1f5f9;color:#64748b}
    .badge-warning{background:#fef9c3;color:#92400e}
    .badge-danger{background:#fee2e2;color:#991b1b}

    .filters-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .filters-bar input,.filters-bar select{height:36px;padding:0 12px;border-radius:8px;border:1px solid #e2e8f0;font-size:13px;background:#fff}
    .filters-bar input{min-width:220px}

    /* KPIs */
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
    .kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px}
    .kpi-card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;font-weight:700}
    .kpi-card .v{font-size:22px;font-weight:900;color:#0f172a;margin-top:4px}
    .kpi-card .v small{font-size:12px;font-weight:600;color:#64748b}

    /* Kanban */
    .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
    .kanban-col{flex:0 0 260px;background:#f8fafc;border:1px solid #eef2f7;border-radius:14px;padding:10px;min-height:120px}
    .kanban-col__head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
    .kanban-col__title{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.04em}
    .kanban-col__count{font-size:11px;font-weight:800;color:#64748b;background:#e2e8f0;border-radius:999px;padding:2px 9px}
    .kanban-card{background:#fff;border:1px solid #e6ebf1;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,transform .05s}
    .kanban-card:hover{box-shadow:0 6px 16px rgba(15,23,42,.08);transform:translateY(-1px)}
    .kanban-card__folio{font-size:13px;font-weight:800;color:#0f172a}
    .kanban-card__cliente{font-size:13px;color:#334155;margin-top:2px}
    .kanban-card__meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#64748b;align-items:center}
    .kanban-card__chip{background:#f1f5f9;border-radius:999px;padding:2px 8px;font-weight:700}
    .kanban-card__age{margin-left:auto;color:#94a3b8;font-size:11px}
    .kanban-empty{color:#94a3b8;font-size:12px;text-align:center;padding:14px 0}

    .closed-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin:8px 0 12px;font-size:13px;font-weight:700;color:#334155}
    .banner-cap{background:#fef9c3;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar-placeholder"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Promotoría</div>
        <h1>Pipeline de oportunidades</h1>
        <p>Prospección y seguimiento del embudo de venta.</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-primary" id="btn-nueva-oportunidad">➕ Nueva oportunidad</button>
      </div>
    </div>

    <div class="content">

      <!-- KPIs -->
      <div class="kpi-row" id="kpi-row"></div>

      <!-- Filtros -->
      <div class="filters-bar">
        <input type="text" id="filtro-buscar" placeholder="🔍  Folio o cliente…">
        <select id="filtro-ramo"><option value="">Todos los ramos</option></select>
        <span class="picker-field" id="grupo-filtro-agente" style="display:none">
          <input type="text" id="filtro-agente-label" class="form-control" readonly
                 placeholder="Todos los agentes" style="min-width:180px">
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-agente-btn" title="Buscar agente">🔍</button>
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-agente-clear" title="Quitar filtro">✕</button>
        </span>
        <input type="hidden" id="filtro-agente">
        <span class="picker-field" id="grupo-filtro-subagente" style="display:none">
          <input type="text" id="filtro-subagente-label" class="form-control" readonly
                 placeholder="Todos los sub-agentes" style="min-width:180px">
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-subagente-btn" title="Buscar sub-agente">🔍</button>
          <button type="button" class="btn btn-ghost btn-sm" id="filtro-subagente-clear" title="Quitar filtro">✕</button>
        </span>
        <input type="hidden" id="filtro-subagente">
        <select id="filtro-canal">
          <option value="">Todos los canales</option>
          <option value="agente">Agente</option>
          <option value="llamada">Llamada</option>
          <option value="web">Web</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="interno">Interno</option>
          <option value="api">API</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="btn-limpiar">Limpiar</button>
        <span id="contador" style="margin-left:auto;font-size:13px;color:#64748b"></span>
      </div>

      <div id="banner-cap" class="banner-cap" style="display:none"></div>

      <!-- Kanban abiertas -->
      <div class="kanban" id="kanban-abiertas"></div>

      <!-- Cerradas (colapsable) -->
      <div class="closed-toggle" id="closed-toggle">
        <span id="closed-caret">▸</span>
        <span>Cerradas y recontactos</span>
        <span class="kanban-col__count" id="closed-count">0</span>
      </div>
      <div class="kanban" id="kanban-cerradas" style="display:none"></div>

    </div><!-- /content -->
  </main>
</div>

<script src="/js/config.js?v=1.6"></script>
<script src="/js/services/api.js?v=1.6"></script>
<script src="/js/services/auth.service.js?v=1.6"></script>
<script src="/js/services/catalogos.service.js?v=1.6"></script>
<script src="/js/services/agentes.service.js?v=1.6"></script>
<script src="/js/services/oportunidades.service.js?v=1.6"></script>
<script src="/js/utils/format.js?v=1.6"></script>
<script src="/js/utils/toast.js?v=1.6"></script>
<script src="/js/utils/modal.js?v=1.6"></script>
<script src="/js/utils/picker.js?v=1.6"></script>
<script src="/js/utils/permisos.js?v=1.6"></script>
<script src="/js/components/sidebar.js?v=1.6"></script>
<script src="/js/utils/auth.guard.js?v=1.6"></script>
<script src="/js/pages/pipeline.js?v=1.6"></script>
</body>
</html>
