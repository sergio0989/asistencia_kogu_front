<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bandeja de casos — Kogu Asistencias</title>
  <link rel="stylesheet" href="/styles/styles.css?v=1.4">
  <style>
    .tabs-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .tab-btn{padding:7px 16px;border-radius:999px;border:1.5px solid #e2e8f0;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#64748b;transition:all .15s;white-space:nowrap}
    .tab-btn:hover{border-color:#0891b2;color:#0891b2}
    .tab-btn.active{background:#0f172a;border-color:#0f172a;color:#fff}
    .filter-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .filter-group{display:flex;flex-direction:column;gap:4px;min-width:150px}
    .filter-group.wide{min-width:220px}
    .filter-group label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8}
    .filter-group select,.filter-group input{height:34px;padding:0 10px;border-radius:8px;border:1px solid #e2e8f0;font-size:12px;background:#fff}
    .filter-group input{min-width:180px}
    .folio-link{color:#0891b2;font-weight:700;cursor:pointer;font-family:ui-monospace,monospace;font-size:11px}
    .folio-link:hover{text-decoration:underline}
    .row-meta{font-size:11px;color:#94a3b8;margin-top:2px}
    .canal-icon{font-size:16px}
    .pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:13px}
    .btn-page{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:12px;font-weight:600}
    .btn-page.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .btn-page.disabled{opacity:.4;cursor:not-allowed}
    .pagination-info{color:#64748b}
    .pagination-controls{display:flex;gap:4px;align-items:center}
    .pagination-ellipsis{color:#94a3b8;padding:0 4px}
    .badge-subtipo{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569}
    .metrics-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .metric-mini{flex:1;min-width:120px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px}
    .metric-mini__label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;font-weight:700}
    .metric-mini__value{font-size:20px;font-weight:900;color:#0f172a;margin-top:4px}
    .metric-mini__value.alert{color:#dc2626}
    .metric-mini__value.warn{color:#d97706}
    .skeleton-line{height:14px;background:#f1f5f9;border-radius:4px;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton-row td div{margin:3px 0}
    .urgencia-row--critico td:first-child{border-left:3px solid #dc2626}
    .urgencia-row--alto td:first-child{border-left:3px solid #d97706}
    .urgencia-row--medio td:first-child{border-left:3px solid #0891b2}
    .urgencia-row--bajo td:first-child{border-left:3px solid #16a34a}
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar-placeholder"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Operación</div>
        <h1>Bandeja de casos</h1>
        <p>Todos los expedientes de asistencia legal — filtra, busca y gestiona desde aquí</p>
      </div>
      <div class="topbar-cards">
        <div class="top-mini">
          <div class="k">Total activos</div>
          <div class="v" id="kpi-activos">—</div>
        </div>
        <div class="top-mini">
          <div class="k">Sin asignar</div>
          <div class="v" id="kpi-sin-asignar" style="color:#d97706">—</div>
        </div>
        <div class="top-mini">
          <div class="k">Críticos</div>
          <div class="v" id="kpi-criticos" style="color:#dc2626">—</div>
        </div>
      </div>
    </div>

    <div class="content">

      <!-- TABS DE ESTATUS -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="todos">Todos</button>
        <button class="tab-btn" data-tab="abierto">Nuevos</button>
        <button class="tab-btn" data-tab="asignado">Asignados</button>
        <button class="tab-btn" data-tab="en_proceso">En proceso</button>
        <button class="tab-btn" data-tab="pendiente_doc">Pend. documentos</button>
        <button class="tab-btn" data-tab="cerrado">Cerrados</button>
      </div>

      <!-- FILTROS -->
      <div class="filter-card">
        <div class="filter-group wide">
          <label>Buscar</label>
          <input type="text" id="filtro-buscar" placeholder="Folio, conductor, siniestro…">
        </div>
        <div class="filter-group">
          <label>Urgencia</label>
          <select id="filtro-urgencia">
            <option value="">Todas</option>
            <option value="critico">🔴 Crítico</option>
            <option value="alto">🟠 Alto</option>
            <option value="medio">🔵 Medio</option>
            <option value="bajo">🟢 Bajo</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Canal</label>
          <select id="filtro-canal">
            <option value="">Todos</option>
            <option value="llamada">📞 Llamada</option>
            <option value="web">🌐 Web</option>
            <option value="whatsapp">💬 WhatsApp</option>
            <option value="interno">🏢 Interno</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Empresa</label>
          <select id="filtro-empresa">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Fecha desde</label>
          <input type="date" id="filtro-fecha-desde">
        </div>
        <div class="filter-group">
          <label>Fecha hasta</label>
          <input type="date" id="filtro-fecha-hasta">
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <button class="btn btn-primary btn-sm" id="btn-aplicar-filtros">Filtrar</button>
          <button class="btn btn-ghost btn-sm" id="btn-limpiar-filtros">Limpiar</button>
        </div>
        <span id="contador-resultados" style="margin-left:auto;align-self:flex-end;font-size:12px;color:#64748b"></span>
      </div>

      <!-- TABLA -->
      <div class="table-wrap">
        <table style="width:100%" id="tabla-bandeja">
          <thead>
            <tr>
              <th style="width:130px">Folio</th>
              <th>Conductor</th>
              <th style="width:100px">Canal</th>
              <th>Empresa</th>
              <th style="width:90px">Urgencia</th>
              <th style="width:130px">Estatus</th>
              <th style="width:130px">Abogado</th>
              <th style="width:110px">Apertura</th>
              <th style="width:90px;text-align:center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-bandeja-body"></tbody>
        </table>
      </div>

      <!-- PAGINACIÓN -->
      <div id="paginacion" class="pagination-wrap"></div>

    </div>
  </main>
</div>

<script src="/js/config.js?v=1.4"></script>
<script src="/js/services/api.js?v=1.4"></script>
<script src="/js/services/auth.service.js?v=1.4"></script>
<script src="/js/services/asistencias.service.js?v=1.4"></script>
<script src="/js/services/catalogos.service.js?v=1.4"></script>
<script src="/js/utils/format.js?v=1.4"></script>
<script src="/js/utils/toast.js?v=1.4"></script>
<script src="/js/utils/modal.js?v=1.4"></script>
<script src="/js/utils/table.js?v=1.4"></script>
<script src="/js/utils/permisos.js?v=1.4"></script>
<script src="/js/components/sidebar.js?v=1.4"></script>
<script src="/js/utils/auth.guard.js?v=1.4"></script>
<script src="/js/pages/bandeja.js?v=1.4"></script>
</body>
</html>
